<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Adriana Araiza · Credian</title>
<meta name="description" content="Gerente de operaciones en Credian. Guarda mi contacto o escríbeme.">
<meta name="theme-color" content="#0C3453">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo:   #0C3453;
    --azul:    #124F7D;
    --verde:   #33AD72;
    --verde-o: #2A9160;
    --hueso:   #F2F6F8;
    --niebla:  #8FAAC0;
    --linea:   rgba(242, 246, 248, 0.14);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    color: var(--hueso);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .tarjeta {
    width: 100%;
    max-width: 30rem;
    padding: 2rem 1.75rem 3rem;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Encabezado ---------- */

  .marca {
    margin: 0 0 2rem;
    font-size: 1.0625rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .marca b { color: var(--verde); font-weight: 800; }

  .retrato {
    width: 5.5rem;
    height: 5.5rem;
    border-radius: 50%;
    object-fit: cover;
    background: var(--azul);
    display: block;
    margin-bottom: 1.5rem;
  }

  /* ---------- Nombre ---------- */

  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 12vw, 3.5rem);
    font-weight: 800;
    line-height: 0.94;
    letter-spacing: -0.035em;
  }

  .puesto {
    margin: 1.125rem 0 0;
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: -0.01em;
  }

  .lugar {
    margin: 0.375rem 0 0;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--niebla);
    max-width: 24rem;
  }

  /* ---------- Acción principal ---------- */

  .guardar {
    display: block;
    margin: 2.25rem 0 2.5rem;
    padding: 1.125rem 1.25rem;
    border-radius: 0.75rem;
    background: var(--verde);
    color: #06251C;
    font-size: 1.0625rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .guardar:active { background: var(--verde-o); }

  /* ---------- Canales ---------- */

  .canales { border-top: 1px solid var(--linea); }

  .canal {
    display: block;
    padding: 1.125rem 0;
    border-bottom: 1px solid var(--linea);
    text-decoration: none;
    color: inherit;
  }

  .canal:active { background: var(--azul); }

  .canal dt {
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -0.015em;
  }

  .canal dd {
    margin: 0.1875rem 0 0;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--niebla);
    word-break: break-word;
  }

  dl { margin: 0; }

  /* ---------- Accesibilidad ---------- */

  a:focus-visible {
    outline: 2px solid var(--verde);
    outline-offset: 3px;
    border-radius: 0.25rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main class="tarjeta">

  <p class="marca">cred<b>i</b>an</p>

  <img class="retrato"
       src="adri.jpg"
       alt="Adriana Araiza Ramírez"
       width="88" height="88">

  <h1>Adriana<br>Araiza</h1>
  <p class="puesto">Gerente de operaciones</p>
  <p class="lugar">Financiera RECREA, SOFOM E.N.R. — San Luis Potosí</p>

  <a class="guardar" href="contacto.vcf">Guardar contacto</a>

  <dl class="canales">

    <a class="canal" href="https://wa.me/524441418022">
      <dt>WhatsApp</dt>
      <dd>444 141 8022</dd>
    </a>

    <a class="canal" href="tel:+524441418022">
      <dt>Llamada</dt>
      <dd>+52 444 141 8022</dd>
    </a>

    <a class="canal" href="mailto:adriana@credian.mx">
      <dt>Correo</dt>
      <dd>adriana@credian.mx</dd>
    </a>

    <a class="canal" href="https://maps.google.com/?q=Av.+Cordillera+de+los+Himalaya+830,+Lomas+4ta+Secc,+78216+San+Luis+Potos%C3%AD,+S.L.P.">
      <dt>Oficina</dt>
      <dd>Av. Cordillera de los Himalaya 830, Lomas 4ta Secc, 78216 San Luis Potosí</dd>
    </a>

    <a class="canal" href="https://credian.mx">
      <dt>Credian</dt>
      <dd>credian.mx</dd>
    </a>

  </dl>

</main>

</body>
</html>
